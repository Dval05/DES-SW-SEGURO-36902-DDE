$kind: http-request
name: REV-04 | Permiso restaurado
description: ""
url: "{{qa_stegoUrl}}/api/steganography/analyze"
method: POST
headers:
  Authorization: Bearer {{qa_analystJwt}}
body:
  type: formdata
  content:
    - type: file
      key: file
      src: samples/original/reference.png
      contentType: image/png
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201',()=>pm.response.to.have.status(201));
      pm.test('Clasificacion sin_indicios',()=>pm.expect(pm.response.json().status).to.eql('sin_indicios'));
      pm.test('Trazabilidad del archivo',()=>{const j=pm.response.json();pm.expect(j.sha256).to.match(/^[a-f0-9]{64}$/);pm.expect(j).to.include.all.keys('id','user_id','technique','indicators','created_at','action','limitations');});
    language: text/javascript
order: 4000
