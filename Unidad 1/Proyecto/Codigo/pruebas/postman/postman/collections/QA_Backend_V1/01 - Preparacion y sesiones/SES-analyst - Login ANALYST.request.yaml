$kind: http-request
name: SES-analyst | Login ANALYST
description: ""
url: "{{qa_authUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identity": "{{qa_analystIdentity}}",
      "password": "{{qa_analystPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201',()=>pm.response.to.have.status(201));
      if(pm.response.code===201) pm.environment.set('qa_analystJwt',pm.response.json().access_token);
      pm.test('JWT emitido y expiracion acotada',()=>{const j=pm.response.json();pm.expect(j.access_token).to.be.a('string');pm.expect(j.expires_in).to.be.within(1,3600);});
    language: text/javascript
order: 4000
