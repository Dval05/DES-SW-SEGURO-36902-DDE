$kind: http-request
name: OAS-01 | Contrato AUTH utilizable
description: ""
url: "{{qa_authUrl}}/docs-json"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('UpdateUserDto y UpdateRoleDto completos',()=>{const s=pm.response.json().components.schemas;pm.expect(s.UpdateUserDto.properties.username).to.be.an('object');pm.expect(s.UpdateRoleDto.properties.rol).to.be.an('object');});
    language: text/javascript
order: 6000
