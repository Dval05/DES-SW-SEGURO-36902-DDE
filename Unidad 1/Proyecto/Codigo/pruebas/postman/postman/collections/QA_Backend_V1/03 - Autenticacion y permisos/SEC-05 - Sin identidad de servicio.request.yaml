url: "{{qa_authUrl}}/internal/authorization/check"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "subject_token": "{{qa_analystJwt}}",
      "action": "steganography.analyze",
      "resource_id": null
    }
scripts:
