$kind: http-request
name: REV-03 | Restaurar ANALYST
description: ""
url: "{{qa_authUrl}}/api/user-roles"
method: POST
headers:
  Authorization: Bearer {{qa_adminJwt}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{qa_analystId}}",
      "roleId": "{{qa_analystRoleId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201',()=>pm.response.to.have.status(201));
      if(pm.response.code===201)pm.environment.set('qa_assignmentId',pm.response.json().id);
    language: text/javascript
order: 3000
