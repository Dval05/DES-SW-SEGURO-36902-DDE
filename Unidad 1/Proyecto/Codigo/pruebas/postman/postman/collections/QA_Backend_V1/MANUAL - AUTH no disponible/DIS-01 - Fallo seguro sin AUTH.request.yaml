$kind: http-request
name: DIS-01 | Fallo seguro sin AUTH
description: ""
url: "{{qa_stegoUrl}}/api/steganography/analyze"
method: POST
headers:
  Authorization: Bearer {{qa_adminJwt}}
body:
  type: formdata
  content:
    - type: file
      key: file
      src: samples/original/reference.png
      contentType: image/png
scripts:
  - type: afterResponse
    code: pm.test('HTTP 503',()=>pm.response.to.have.status(503));
    language: text/javascript
order: 1000
